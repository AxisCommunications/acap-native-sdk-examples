name: Build vdo-larod applications
on:
  workflow_dispatch:
  push:
    paths:
      - 'vdo-larod/**'
      - '!vdo-larod/README.md'
      - '.github/workflows/vdo-larod.yml'
jobs:
  test-app:
    name: Test app
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7hf
            chip: cpu
            axis-os: 12.11.72
          - arch: armv7hf
            chip: edgetpu
            axis-os: 12.11.72
          - arch: aarch64
            chip: artpec8
            axis-os: 12.11.72
          - arch: aarch64
            chip: artpec9
            axis-os: 12.11.72
          - arch: aarch64
            chip: cv25
            axis-os: 12.11.72
    env:
      EXREPO: acap-native-examples
      EXNAME: vdo-larod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ env.example }} application
        env:
          example: ${{ env.EXNAME }}-${{ matrix.chip }}
          imagetag: ${{ env.EXREPO }}_${{ env.EXNAME }}_${{ matrix.chip }}:${{ matrix.arch }}
        run: |
          docker image rm -f $imagetag
          cd $EXNAME
          docker build --no-cache --build-arg CHIP=${{ matrix.chip }} --build-arg ARCH=${{ matrix.arch }} --tag $imagetag .
          docker cp $(docker create $imagetag):/opt/app ./build_${{ matrix.chip }}
          cd ..
          docker image rm -f $imagetag
